server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 16m;            # image uploads (app limit is MAX_UPLOAD_MB, default 5)

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  # Content-Security-Policy: scripts only from our own origin (blocks injected inline scripts); Google Fonts and
  # Google Maps embeds are the only third parties. Add your CDN/image host to img-src if you use Cloudinary/S3 URLs.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-src https://www.google.com https://maps.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  # Terminate HTTPS in front of this container (load balancer / Caddy / certbot) and add:
  #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # API + uploaded media go to the backend. X-Forwarded-For is OVERWRITTEN (not appended) so clients
  # cannot spoof their IP for rate limiting; the backend runs with TRUST_PROXY_HEADERS=true.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
  location /media/ {
    proxy_pass http://backend:8000;
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'none'; sandbox" always;  # uploads can never run as a page
  }
  # SEO files are generated from admin settings
  location = /robots.txt  { proxy_pass http://backend:8000/api/v1/public/robots.txt; }
  location = /sitemap.xml { proxy_pass http://backend:8000/api/v1/public/sitemap.xml; }

  # hashed build assets: cache forever
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  # SPA fallback; index.html itself must never be cached
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
